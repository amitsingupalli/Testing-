&#65279;<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Prompt & Tool Playground | Agent Mentor</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">&#129302;</span>
                <span class="logo-text">Agent Mentor</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="roadmap.html" class="nav-link">Roadmap</a></li>
                <li><a href="studyplan.html" class="nav-link">Study Plan</a></li>
                <li><a href="topics.html" class="nav-link">Topics</a></li>
                <li><a href="playground.html" class="nav-link active">Playground</a></li>
            </ul>
        </div>
    </nav>
    <main style="padding-top: 100px; max-width: 1000px; margin: 0 auto; padding-left: 1.5rem; padding-right: 1.5rem;">
        <div class="text-center" style="margin-bottom: 2rem;">
            <h1>Interactive <span class="gradient-text">Agent Playground</span></h1>
            <p>Test prompt templates, simulate ReAct reasoning loops, and inspect tool JSON outputs in real time.</p>
        </div>
        <div class="card" style="margin-bottom: 2rem;">
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">System Prompt Instructions</label>
            <textarea id="promptInput" style="width: 100%; min-height: 120px; background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; font-family: var(--font-code); margin-bottom: 1rem;">You are a senior AI agent engineer. Explain how LangGraph handles human-in-the-loop cycles.</textarea>
            <button class="btn btn-primary" onclick="simulateAgent()">Execute Agent Simulation</button>
        </div>
        <div class="card" id="outputCard" style="display: none;">
            <h3>Simulation Trajectory Log</h3>
            <pre style="background: var(--bg-code); padding: 1rem; border-radius: var(--radius-md); margin-top: 1rem; overflow-x: auto;"><code id="outputLog"></code></pre>
        </div>
    </main>
    <script>
    function simulateAgent() {
        const out = document.getElementById('outputCard');
        const log = document.getElementById('outputLog');
        out.style.display = 'block';
        log.textContent = '&#128640; Booting Agent Loop...\\n[Step 1] Reasoning over system prompt...\\n[Step 2] Selected Tool: query_knowledge_graph()\\n[Step 3] Observation: LangGraph uses checkpointers (MemorySaver) and interrupts.\\n[Step 4] Final Synthesis Complete.';
    }
    </script>
</body>
</html>
